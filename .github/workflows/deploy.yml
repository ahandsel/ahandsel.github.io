# .github/workflows/deploy.yml
# Build and deploy a VitePress site to GitHub Pages
# Triggered on pushes to the main branch or "Run workflow" button

name: Deploy VitePress site to GitHub Pages

on:
  workflow_dispatch: {} # Allow manual execution from the GitHub Actions tab
  push:
    branches: [main] # Run this workflow only for commits to `main`
    # Skill-copy sync commits touch only .github/skills/ and do not change the
    # published site, so skip the Pages deploy for those pushes.
    paths-ignore:
      - '.github/skills/**'

permissions: {} # Default permission set as none; each job grants only what it needs

# Ensures that only one deploy runs at a time for this project
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build and upload job
  build:
    name: Build and upload VitePress site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Read-only checkout for the build
      pages: read # Required by configure-pages to read the Pages site config

    steps:
      # Step 1: Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v5.0.0, pinned
        with:
          fetch-depth: 0
      # Step 2: Detect pnpm version from package.json
      - name: Detect pnpm version
        id: pnpm-version
        run: |
          version="$(jq -r '.packageManager' package.json | cut -d'@' -f2)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Step 3: Install pnpm package manager (use detected version)
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # pnpm/action-setup@v4.2.0, pinned
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      # Step 4: Setup Node.js (required by pnpm and VitePress)
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v5.0.0, pinned
        with:
          node-version: 24.12 # Match engines.node (>=24.12) in package.json
          cache: pnpm

      # Step 5: Install project dependencies
      - name: Install dependencies
        run: pnpm install

      # Step 6: Build the VitePress site
      # GITHUB_TOKEN raises the GitHub API rate limit for the Projects page
      # data loader (contents/.vitepress/theme/repos.data.mts) from 60 to 5000
      # requests per hour. It is optional; the build also works without it.
      - name: Build VitePress site
        run: pnpm vitepress-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 7: Prepare artifact for GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # actions/configure-pages@v5.0.0, pinned

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # actions/upload-pages-artifact@v4.0.0, pinned
        with:
          path: contents/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # Required to publish to GitHub Pages
      id-token: write # Required by deploy-pages to verify the deployment origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # actions/deploy-pages@v4.0.5, pinned
