# .github/workflows/pr-build-check.yml
# Verify pull requests before merge: naming rules, contents tree snapshot,
# en/ja parity, script tests, license check, and a production VitePress build.
# Posts the results as a sticky comment on the pull request.
# Formatting fixes are handled separately by pr-lint-autofix.yml, which skips
# fork pull requests, so this workflow gates formatting on forks only.

name: PR build check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {} # Default permission set as none; each job grants only what it needs

# One run per pull request; a new push cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Build and verify site
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read # Read-only checkout for the checks
      pull-requests: write # Required to create or update the sticky report comment

    steps:
      # Step 1: Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # actions/checkout@v5.0.0, pinned

      # Step 2: Detect pnpm version from package.json
      - name: Detect pnpm version
        id: pnpm-version
        run: |
          version="$(jq -r '.packageManager' package.json | cut -d'@' -f2)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Step 3: Install pnpm package manager (use detected version)
      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # pnpm/action-setup@v4.2.0, pinned
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      # Step 4: Setup Node.js (required by pnpm and VitePress)
      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # actions/setup-node@v5.0.0, pinned
        with:
          node-version: 24.12 # Match engines.node (>=24.12) in package.json
          cache: pnpm

      # Step 5: Install project dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 6: Check formatting on fork pull requests
      # pr-lint-autofix.yml fixes formatting on same-repository pull requests, but
      # it skips forks because it cannot push to them, so gate forks here instead.
      - name: Check formatting (fork pull requests only)
        id: format
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          pnpm lint
          git diff --exit-code

      # Step 7: Check file and folder names
      - name: Check file and folder names
        id: naming
        run: pnpm lint-naming

      # Step 8: Check that docs/contents-structure.md matches contents/
      - name: Check contents tree snapshot
        id: tree
        run: pnpm test-tree

      # Step 9: Check that the en and ja trees stay in parity
      - name: Check en/ja parity
        id: parity
        run: pnpm check-en-ja-parity

      # Step 10: Run the script test suite
      - name: Run script tests
        id: tests
        run: pnpm test

      # Step 11: Type-check the VitePress config and theme
      - name: Typecheck
        id: typecheck
        run: pnpm typecheck

      # Step 12: Check OSS licenses
      - name: Check licenses
        id: license
        run: pnpm license

      # Step 13: Build the VitePress site
      # GITHUB_TOKEN raises the GitHub API rate limit for the Projects page
      # data loader (contents/.vitepress/theme/repos.data.mts).
      - name: Build VitePress site
        id: build
        run: pnpm vitepress-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 14: Verify the build output landed where deploy.yml expects it
      - name: Verify build output
        id: verify
        run: test -f contents/.vitepress/dist/index.html

      # Step 15: Post the report as a sticky pull request comment
      # Skipped for fork pull requests, which run with a read-only token.
      - name: Post PR report
        if: ${{ always() && github.event.pull_request.head.repo.fork == false }}
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4, pinned
        with:
          header: '🛠️ PR build check report'
          message: |
            **Workflow:** `${{ github.workflow }}`
            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Overall:** `${{ job.status }}`

            * Naming rules: `${{ steps.naming.outcome }}`
            * Contents tree: `${{ steps.tree.outcome }}`
            * en/ja parity: `${{ steps.parity.outcome }}`
            * Script tests: `${{ steps.tests.outcome }}`
            * Typecheck: `${{ steps.typecheck.outcome }}`
            * License check: `${{ steps.license.outcome }}`
            * Site build: `${{ steps.build.outcome }}`
            * Output check: `${{ steps.verify.outcome }}`
