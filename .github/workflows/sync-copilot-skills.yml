name: Sync Copilot skill copies

# GitHub Copilot does not support symlinks, so .github/skills/ holds real
# copies of the canonical skills/ folders. This workflow keeps the copies in
# sync: on every push to main that touches skills/, it copies each skill that
# has a counterpart under .github/skills/ over that counterpart and commits
# the result. The sync commit only touches .github/skills/, so it cannot
# retrigger this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
  workflow_dispatch: # Allows manual trigger

permissions: {} # Default permission set as none; the job grants only what it needs

# One run at a time; a newer push cancels the stale run and re-syncs everything.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sync-copilot-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required to push the refreshed copies back to main
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # actions/checkout@v5.0.0, pinned

      - name: Copy canonical skills over their .github/skills counterparts
        run: |
          for copy in .github/skills/*/; do
            name="$(basename "$copy")"
            if [ -d "skills/$name" ]; then
              rsync --archive --delete "skills/$name/" "$copy"
              echo "✅ Synced skills/$name to $copy"
            else
              echo "❌ skills/$name no longer exists. Delete .github/skills/$name or restore the skill."
              exit 1
            fi
          done

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain -- .github/skills)" ]; then
            echo "✅ Copies already in sync. Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/skills
          git commit -m "chore: sync Copilot skill copies from skills/"
          git push origin HEAD:main
