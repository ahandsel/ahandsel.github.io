name: Lint and autofix PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {} # Default permission set as none; the job grants only what it needs

# One run per pull request; a new push cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Required to push the formatting fixes back to the branch
    env:
      PR_HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # actions/checkout@v5.0.0, pinned
        with:
          ref: ${{ env.PR_HEAD_REF }}
          fetch-depth: 0

      - name: Detect pnpm version
        id: pnpm-version
        run: |
          version="$(jq -r '.packageManager' package.json | cut -d'@' -f2)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # pnpm/action-setup@v4.2.0, pinned
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # actions/setup-node@v5.0.0, pinned
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      # Regenerate the contents tree snapshot so a stale
      # docs/contents-structure.md is fixed here instead of only failing the
      # PR build check.
      - name: Regenerate contents tree
        run: pnpm tree

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage tracked modifications only, so an untracked build or install
          # artifact can never be committed by this workflow.
          git add -u
          git commit -m "chore: apply lint fixes"
          git push origin HEAD:"$PR_HEAD_REF"
